# Roda o mesmo que `make verificar` (lint + testes do Go + testes de
# interface) e confere que a imagem de produção (Dockerfile, usada pelo
# Render) monta. Em todo PR e em todo push na dev e na main.
name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

# um push novo no mesmo PR/branch cancela a rodada anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Go (lint e testes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # main.go embute frontend/dist; os testes não usam o frontend de
      # verdade (ele é testado no job de interface)
      - name: Frontend provisório para o go:embed
        run: mkdir -p frontend/dist && echo ok > frontend/dist/index.html

      - name: Lint
        run: make lint

      - name: Testes (inclui os cenários com planilhas)
        run: go test ./...

  interface:
    name: Interface (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Dependências do frontend
        working-directory: frontend
        run: npm ci

      - name: Navegador do Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # o Playwright compila o frontend e sobe o servidor Go sozinho
      - name: Testes de interface
        working-directory: frontend
        run: npm run test:e2e

      - name: Relatório dos testes de interface
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  docker:
    name: Imagem de produção (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build da imagem
        run: docker build -t candidate-allocation .
